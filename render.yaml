services:
  - type: web
    name: novax-paper-exchange
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: NOVAX_PUBLIC_ORIGIN
        sync: false
      - key: NOVAX_SESSION_DAYS
        value: "14"
      - key: NOVAX_MAX_JSON_BYTES
        value: "1000000"
      - key: NOVAX_PASSWORD_RESET_MINUTES
        value: "30"
      - key: NOVAX_ADMIN_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_HELO_NAME
        sync: false
      - key: NOVAX_EMAIL_FROM
        sync: false
      - key: NOVAX_SUPPORT_EMAIL
        sync: false
